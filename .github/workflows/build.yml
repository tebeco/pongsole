name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/check-native-rtc.mjs
      - name: Build macOS native WebRTC library
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          if (-not (brew list --versions openssl@3)) {
            brew install openssl@3
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          brew list --versions openssl@3
          $target = if ((uname -m) -eq 'arm64') { 'osx-arm64' } else { 'osx-x64' }
          ./scripts/build-native-rtc.ps1 -Target $target
      - run: node --test "tests/Pongsole.Browser.Tests/*.test.mjs"
      - run: dotnet restore Pongsole.slnx
      - run: dotnet build Pongsole.slnx --configuration Release --no-restore
      - run: dotnet test Pongsole.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Load native WebRTC from published output
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts/native-smoke-publish'
          dotnet publish src/Pongsole.Server -c Release --no-build -o $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Pongsole.NativeSmoke -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item tests/Pongsole.NativeSmoke/bin/Release/net11.0/Pongsole.NativeSmoke.* -Destination $output
          dotnet (Join-Path $output 'Pongsole.NativeSmoke.dll') $output
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

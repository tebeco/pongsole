<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pongsole</title>
  <link rel="stylesheet" href="/pongsole.css">
  <script type="module" src="/pongsole.mjs"></script>
</head>
<body>
  <main class="cabinet">
    <header class="masthead">
      <h1>Pong<span>sole</span></h1>
      <p class="connection" id="connection">Checking access</p>
    </header>
    <section class="game" aria-label="Pong arena">
      <header class="game-controls" aria-label="Game controls">
        <p class="team-label" id="team-label" hidden></p>
        <form id="discord-login" action="/discord/login" method="post" hidden>
          <button type="submit">Sign in with Discord</button>
        </form>
        <form id="discord-logout" action="/discord/logout" method="post" hidden>
          <button type="submit">Sign out</button>
        </form>
        <button id="play-again" type="button" hidden>Play again</button>
        <button id="retry" type="button" hidden>Try again</button>
        <div id="play-controls" hidden>
          <p class="key-help"><kbd>W</kbd> <kbd>↑</kbd> Up <span aria-hidden="true">/</span> <kbd>S</kbd> <kbd>↓</kbd> Down</p>
          <div class="directions">
            <button type="button" class="direction" data-direction="up" aria-label="Move paddle up"><span aria-hidden="true">↑</span> Up</button>
            <button type="button" class="direction" data-direction="down" aria-label="Move paddle down"><span aria-hidden="true">↓</span> Down</button>
          </div>
        </div>
        <button id="leave" type="button" hidden>Leave game</button>
        <p id="message" role="status" aria-live="polite"></p>
        <p id="discord-message" role="status" hidden>Discord sign-in failed. Try again or play as a guest.</p>
      </header>
      <div class="game-mode" id="game-mode" hidden>
        <p id="mode-status" role="status"></p>
        <div id="mode-choices" aria-label="Game mode" role="group" hidden>
          <button type="button" data-mode="allTogether">All together</button>
          <button type="button" data-mode="individualPaddles">Individual paddles</button>
        </div>
        <p id="mode-error" role="status" hidden></p>
      </div>
      <div class="scoreboard" aria-label="Score">
        <div class="team left"><span>Left</span><strong id="left-score">0</strong></div>
        <div class="match"><span id="phase">Ready</span><small id="players">0 players</small></div>
        <div class="team right"><strong id="right-score">0</strong><span>Right</span></div>
      </div>
      <div class="court-layout">
        <section class="roster roster-left" aria-labelledby="roster-left-label">
          <h2 id="roster-left-label">Left team</h2>
          <ul id="roster-left"></ul>
        </section>
        <div class="court">
          <canvas id="arena" role="img" aria-label="Pong court with paddles and balls">Pong court</canvas>
        </div>
        <section class="roster roster-right" aria-labelledby="roster-right-label">
          <h2 id="roster-right-label">Right team</h2>
          <ul id="roster-right"></ul>
        </section>
      </div>
    </section>
    <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
